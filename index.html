<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grimorio delle Voci - GDR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Il Grimorio delle Voci</h1>
      <p>Trasforma la tua voce. Scegli un'entità, regola i parametri e salva le tue evocazioni.</p>
    </header>

    <div id="err" role="alert"></div>

    <section class="panel top-panel">
      <div class="screen" id="screen">
        <canvas id="scope"></canvas>
        <div class="badge"><span class="dot"></span><span id="badgeText">Sigillo Chiuso</span></div>
        <div class="level"><span id="lvFill"></span></div>
      </div>

      <div class="modes" role="group">
        <button id="mPtt" aria-pressed="true">Tieni e Parla (Sicuro)</button>
        <button id="mLive" aria-pressed="false">Incanto Continuo (Usa cuffie)</button>
      </div>

      <div class="bar">
        <button id="power" class="go">Apri Sigillo (Attiva Mic)</button>
        <button id="rec" class="rec" disabled>Registra</button>
        <label class="switch" id="aecWrap" hidden>
          <input type="checkbox" id="aec" checked>
          <span>Anti-eco</span>
        </label>
      </div>

      <audio id="player" playsinline></audio>
      <button id="ptt" class="ptt" disabled>Premi e Recita la Battuta</button>
    </section>

    <section class="panel">
      <h2>Entità Conosciute</h2>
      <div class="presets" id="presets"></div>
      <p class="note" id="presetDesc"></p>
    </section>

    <section class="panel">
      <h2>Alchimia (Regola e Salva)</h2>
      <div class="faders" id="faders"></div>
      <form id="saveForm" class="save-zone">
        <input type="text" id="customName" placeholder="Nome della nuova creatura..." maxlength="24" required>
        <button type="submit" id="saveVoiceBtn">Salva nel Grimorio</button>
      </form>
    </section>

    <section class="panel">
      <h2>Memorie della Campagna</h2>
      <p class="empty" id="empty">Il tomo è vuoto. Registra le profezie e compariranno qui.</p>
      <ul id="takes"></ul>
    </section>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
